services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yedelai
      POSTGRES_DB: mines_financial
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yedelai -d mines_financial"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./bm25_index:/app/bm25_index
      - ./assets:/app/assets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: