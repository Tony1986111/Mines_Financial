[project]
name = "mines-financial"
version = "0.1.0"
description = "ASX mining financial report RAG chatbot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.40.0",
    "tavily-python>=0.5.0",
    "tqdm>=4.66.0",
    "langchain-tavily>=0.2.18",
]

[dependency-groups]
dev = [
    "langgraph-cli>=0.4.27",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false
